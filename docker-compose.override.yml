# 開発環境用のオーバーライド設定
# このファイルはdocker-compose.ymlと自動的にマージされます
# 本番環境では docker-compose -f docker-compose.yml up を使用してください

version: '3.8'

services:
  app:
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      # ホットリロード用のマウント
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
