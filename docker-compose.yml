version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bond_inquiry_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bond_inquiry_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: bond_inquiry_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bond_inquiry_db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env file}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "5001:5000"
    volumes:
      # PDFファイルの永続化
      - ./uploads:/app/uploads
      # テンプレートファイルのホットリロード（開発時）
      - ./server/templates:/app/server/templates
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "if [ \"$NODE_ENV\" = \"development\" ]; then npm run dev; else npm start; fi"

volumes:
  postgres_data:
    driver: local
