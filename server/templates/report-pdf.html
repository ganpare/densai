<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Meiryo', sans-serif; margin: 0; }
    .container { width: 180mm; height: 267mm; padding: 10mm; box-sizing: border-box; }
    .row { display: flex; }
    .cell { border: 1px solid #333; padding: 4px 8px; font-size: 12px; }
    .cell-header { background: #f5f5f5; font-weight: bold; }
    .table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
    .table td, .table th { border: 1px solid #333; padding: 4px 8px; font-size: 12px; }
    .section-title { font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
    .box { border: 1px solid #333; min-height: 32mm; padding: 8px; margin-bottom: 8px; }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <table class="table">
      <tr>
        <td class="cell-header nowrap">金融機関番号</td>
        <td class="cell nowrap">{{bankCode}}</td>
        <td class="cell-header right nowrap">対応日付</td>
        <td class="cell nowrap">{{date}}</td>
      </tr>
      <tr>
        <td class="cell-header nowrap">支店番号</td>
        <td class="cell nowrap">{{branchCode}}</td>
        <td class="cell-header nowrap">利用者番号</td>
        <td class="cell nowrap">{{userNumber}}</td>
      </tr>
      <tr>
        <td class="cell-header nowrap">名称</td>
        <td class="cell nowrap">{{companyName}}</td>
        <td class="cell-header nowrap">受電時刻</td>
        <td class="cell nowrap">{{callTime}}</td>
      </tr>
      <tr>
        <td class="cell-header nowrap">対応完了時刻</td>
        <td class="cell nowrap">{{completeTime}}</td>
        <td class="cell-header nowrap">エスカレーション</td>
        <td class="cell nowrap">{{escalation}}</td>
      </tr>
      <tr>
        <td class="cell-header nowrap">企業対応者</td>
        <td class="cell nowrap">{{companyContact}}</td>
        <td class="cell-header nowrap">当社対応者</td>
        <td class="cell nowrap">{{ourContact}}</td>
      </tr>
    </table>
    <div class="section-title">問合せ内容</div>
    <div class="box">{{inquiryContent}}</div>
    <div class="section-title">対応内容</div>
    <div class="box" style="min-height: 40mm;">{{responseContent}}</div>
  </div>
</body>
</html>
